name: Tests

# 🧪 PR gate. Runs lint and every environment-independent suite from a bare
# checkout via the CI-contract Taskfile targets (`task lint`, `task test` = API
# unit + pi-agent) — the same commands release-please.yaml runs before a release,
# and the same commands you run on a laptop. Plain ubuntu runners: no DinD image
# build, no registry credentials. The HA integration suite has its own job because
# it pins a full homeassistant install.
#
# Environment-dependent e2e tests (task test:e2e:*) are intentionally excluded —
# they need a live deployment (staging is deployed by hand: docs/dev/staging.md).

on:
  pull_request:
    branches: [main, staging]

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-unit:
    name: Lint + unit tests (API, pi-agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install task
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Lint
        id: lint
        run: task lint
      - name: Unit tests
        id: test
        run: |
          set -o pipefail
          task test 2>&1 | tee /tmp/unit.txt
      - name: 📋 Summary
        if: always()
        run: |
          lines=$(grep -ohE '[0-9]+ (passed|failed|error)[a-z0-9 ,.]*' /tmp/unit.txt 2>/dev/null | paste -sd';' - || true)
          if [ "${{ steps.lint.outcome }}" = "success" ]; then lint="✅ ruff"; else lint="❌ ruff"; fi
          if [ "${{ steps.test.outcome }}" = "success" ]; then head="### ✅ 🧪 Lint + unit tests passed"; else head="### ❌ 🧪 Lint + unit tests failed"; fi
          {
            echo "$head"
            echo ""
            echo "🔍 \`task lint\` — ${lint}"
            echo ""
            echo "🔬 \`task test\` — API unit (src/api) + pi-agent (tests/pi-agent)"
            echo ""
            echo "> 📊 \`${lines:-see job logs}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ha-integration:
    name: HA integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ha-integration
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run tests
        id: test
        run: |
          set -o pipefail
          uv run --with-requirements requirements_test.txt pytest -q 2>&1 | tee /tmp/ha.txt
      - name: 📋 Summary
        if: always()
        run: |
          line=$(grep -ohE '[0-9]+ (passed|failed|error)[a-z0-9 ,.]*' /tmp/ha.txt | tail -1 || true)
          if [ "${{ steps.test.outcome }}" = "success" ]; then head="### ✅ 🏠 HA integration tests passed"; else head="### ❌ 🏠 HA integration tests failed"; fi
          {
            echo "$head"
            echo ""
            echo "🧩 Home Assistant custom-component suite (config flow + entity setup)"
            echo ""
            echo "> 📊 \`${line:-see job logs}\`"
          } >> "$GITHUB_STEP_SUMMARY"
