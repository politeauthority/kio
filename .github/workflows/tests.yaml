name: Tests

# 🧪 PR gate. Runs lint and every environment-independent suite from a bare
# checkout via the CI-contract Taskfile targets (`task lint`, `task test` = API
# unit + pi-agent) — the same commands release-please.yaml runs before a release,
# and the same commands you run on a laptop. Plain ubuntu runners: no DinD image
# build, no registry credentials.
#
# Only runs when something these suites actually consume changed (the API, the
# pi-agent and its tests, the Taskfile, or this workflow). Docs, k8s manifests,
# the UI, Dockerfiles, dependabot config etc. don't trigger it. The HA integration
# suite lives in ha-integration.yaml (filtered to src/ha-integration/**), and the
# environment-dependent e2e tests (task test:e2e:*) need a live deployment
# (staging is deployed by hand: docs/dev/staging.md).

on:
  pull_request:
    branches: [main, staging]
    paths: &test-paths
      - "src/api/**"
      - "src/pi-agent/**"
      - "tests/pi-agent/**"
      - "Taskfile.yaml"
      - ".github/workflows/tests.yaml"
  # Also on main itself so the README status badge reflects the default branch.
  push:
    branches: [main]
    paths: *test-paths

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-unit:
    name: Lint + unit tests (API, pi-agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Install task
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Lint
        id: lint
        run: task lint
      - name: Unit tests
        id: test
        run: |
          set -o pipefail
          task test 2>&1 | tee /tmp/unit.txt
      - name: 📋 Summary
        if: always()
        run: |
          lines=$(grep -ohE '[0-9]+ (passed|failed|error)[a-z0-9 ,.]*' /tmp/unit.txt 2>/dev/null | paste -sd';' - || true)
          if [ "${{ steps.lint.outcome }}" = "success" ]; then lint="✅ ruff"; else lint="❌ ruff"; fi
          if [ "${{ steps.test.outcome }}" = "success" ]; then head="### ✅ 🧪 Lint + unit tests passed"; else head="### ❌ 🧪 Lint + unit tests failed"; fi
          {
            echo "$head"
            echo ""
            echo "🔍 \`task lint\` — ${lint}"
            echo ""
            echo "🔬 \`task test\` — API unit (src/api) + pi-agent (tests/pi-agent)"
            echo ""
            echo "> 📊 \`${lines:-see job logs}\`"
          } >> "$GITHUB_STEP_SUMMARY"

