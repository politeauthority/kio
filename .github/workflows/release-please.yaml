name: Release Please
run-name: "Release Please — ${{ github.ref_name }}"

# 🚀 Release pipeline (the private-ops CI/CD pattern; see
# private-ops/docs/cicd-repo-onboarding.md, reference impl: bookmarx).
#
# On every push to main, release-please scans Conventional Commits and maintains a
# "release" PR that bumps VERSION + the HA integration manifest + CHANGELOG.md.
# The PR is auto-merged here (no human click) with a PAT — GITHUB_TOKEN-caused
# pushes do NOT re-trigger workflows, and the merge must re-trigger this one so the
# second run sees `release_created == true`. That run tags vX.Y.Z, creates the
# GitHub Release, builds + pushes kio-api / kio-ui to Harbor, and then stamps the
# release into the private-ops GitOps repo (kio/kio/kustomization.yaml: image tags
# + the base ref, which pins kubernetes-manifests/base to the new tag). ArgoCD
# watches private-ops and rolls prd, running the kio-migrate PreSync hook first.
#
# Two jobs: the release-please action is a JS action (needs the runner's Node, so no
# container); build/deploy needs uv/docker/task from the polite-cicd container.
#
# Repo settings this needs (human-only, see docs/dev/releasing.md):
#   vars:    HARBOR_USER (robot$ci), CICD_VERSION (polite-cicd image tag)
#   secrets: HARBOR_PASSWORD, PAT (merge release PRs + push tags here),
#            PRIVATE_OPS_TOKEN (contents:write on politeauthority/private-ops)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write          # release commit, tag, GitHub Release
  pull-requests: write     # open/update the release PR
  issues: write            # autorelease:* labels

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: kio                    # ARC runner; NO container (uses the runner's Node)
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.PAT }}      # PAT (not github.token): the auto-merge below must re-trigger this workflow
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Auto-merge the release PR so releases need no human click. Rebase-merge with
      # the PAT so the resulting push to main re-triggers this workflow, whose second
      # run cuts the tag + deploys. REST via curl: the runner has no `gh` CLI.
      - name: Auto-merge the release PR
        if: ${{ steps.rp.outputs.prs_created == 'true' }}
        env:
          PAT: ${{ secrets.PAT }}
          PRS: ${{ steps.rp.outputs.prs }}
        run: |
          set -euo pipefail
          echo "$PRS" | jq -r '.[].number' | while read -r pr; do
            echo "::notice::Auto-merging release PR #${pr}"
            code=$(curl -sS -o /tmp/merge-resp.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer ${PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${pr}/merge" \
              -d '{"merge_method":"rebase"}')
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "::notice::Merged release PR #${pr} (HTTP ${code})"
            else
              # A 403 here almost always means the PAT can write contents/PRs but isn't
              # allowed to merge — regenerate it as a classic PAT with `repo` (+`workflow`)
              # scope, or a fine-grained PAT with Contents + Pull requests R/W.
              echo "::error::Failed to merge release PR #${pr} (HTTP ${code}): $(cat /tmp/merge-resp.json)"
              exit 1
            fi
          done

      - name: 📋 Summary
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then WHY="a manual dispatch"; else WHY="a push to \`main\`"; fi
          if [ "${{ steps.rp.outputs.release_created }}" = "true" ]; then
            {
              echo "# 🚀 Release Please — released \`${{ steps.rp.outputs.tag_name }}\`"
              echo ""
              echo "> ▶️ **Why this ran:** ${WHY} — release-please maintains the release PR from Conventional Commits."
              echo ""
              echo "A release PR was merged, so the tag + GitHub Release were created."
              echo "➡️ The **Build, push & deploy** job is running now: images → Harbor, then the private-ops overlay is stamped for ArgoCD."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# 🧾 Release Please — release PR maintained (nothing released)"
              echo ""
              echo "> ▶️ **Why this ran:** ${WHY} — release-please maintains the release PR from Conventional Commits."
              echo ""
              echo "This push was a normal commit, **not** a merged release PR, so no version was cut —"
              echo "release-please just opened/updated (and auto-merged, if it could) the pending release PR."
              echo ""
              echo "⏭️ **Build, push & deploy was skipped** (gated on \`release_created == true\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-deploy:
    name: Build, push & deploy
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: kio
    container:
      image: harbor.squid-ink.us/politeauthority/polite-cicd:${{ vars.CICD_VERSION }}
      options: '--dns 8.8.8.8'
      credentials:
        username: ${{ vars.HARBOR_USER }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    env:
      HARBOR: harbor.squid-ink.us/politeauthority
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}   # build the exact released commit

      - name: Unit tests
        id: unit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          set -o pipefail
          task test 2>&1 | tee /tmp/unit.txt

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.squid-ink.us
          username: ${{ vars.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & push images
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          task ci-build-push

      # Production is GitOps: no kubectl here. The private-ops overlay pins
      # kubernetes-manifests/base to the release tag (which release-please pushed
      # before this job started) and ArgoCD does the migrate hook + rollout.
      - name: Check out private-ops
        uses: actions/checkout@v4
        with:
          repository: politeauthority/private-ops
          token: ${{ secrets.PRIVATE_OPS_TOKEN }}
          path: private-ops
          fetch-depth: 1

      - name: Stamp the private-ops prd overlay and push
        env:
          PRIVATE_OPS_DIR: ${{ github.workspace }}/private-ops
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$PRIVATE_OPS_DIR"
          task stamp-prd
          cd private-ops
          git config user.name "kio-ci"
          git config user.email "ci@kio.colfax.int"
          git add kio/kio/kustomization.yaml
          git commit -m "chore(kio): release kio v${VERSION}"
          # Retry once on a non-fast-forward (another app's release may have landed).
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }

      - name: 📋 Release summary
        if: always()
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          UNIT=$(grep -ohE '[0-9]+ (passed|failed|error)[a-z0-9 ,.]*' /tmp/unit.txt 2>/dev/null | tail -1 || true)
          {
            echo "# 🚀 Released v${VERSION} 🎉"
            echo ""
            echo "> ▶️ **Why this ran:** a release PR was merged (\`release_created == true\`), cutting \`${{ needs.release-please.outputs.tag_name }}\`."
            echo ""
            echo "🧪 Unit tests: \`${UNIT:-see logs}\`"
            echo ""
            echo "| 🏷️ Version | 🐳 Images | 📦 Registry |"
            echo "| --- | --- | --- |"
            echo "| \`v${VERSION}\` | \`kio-api:${VERSION}\` · \`kio-ui:${VERSION}\` (+ \`:latest\`) | \`harbor.squid-ink.us/politeauthority\` |"
            echo ""
            echo "📝 private-ops \`kio/kio/kustomization.yaml\` stamped → 🔄 ArgoCD syncs prd (⚠️ kio-migrate PreSync hook → rollout)."
          } >> "$GITHUB_STEP_SUMMARY"
