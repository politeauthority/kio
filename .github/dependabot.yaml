version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/src/api"
    schedule:
      interval: "weekly"
    # `deps:` is a visible changelog section in release-please-config.json, so a
    # merged Dependabot PR cuts a patch release (the default `chore(deps):` is hidden
    # and would never release).
    commit-message:
      prefix: "deps"
    groups:
      python-deps:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/src/ui"
    schedule:
      interval: "weekly"
    # `deps:` is a visible changelog section in release-please-config.json, so a
    # merged Dependabot PR cuts a patch release (the default `chore(deps):` is hidden
    # and would never release).
    commit-message:
      prefix: "deps"
    groups:
      ui-deps:
        patterns:
          - "*"
    ignore:
      # Majors of build-critical tooling (Vite, Vue, ...) are breaking migrations,
      # never a group-merge — do them deliberately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # `deps:` is a visible changelog section in release-please-config.json, so a
    # merged Dependabot PR cuts a patch release (the default `chore(deps):` is hidden
    # and would never release).
    commit-message:
      prefix: "deps"
    groups:
      actions:
        patterns:
          - "*"
