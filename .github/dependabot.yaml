version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/src/api"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/src/ui"
    schedule:
      interval: "weekly"
    groups:
      ui-deps:
        patterns:
          - "*"
    ignore:
      # Majors of build-critical tooling (Vite, Vue, ...) are breaking migrations,
      # never a group-merge — do them deliberately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot updates
  # both the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
