# Staging (kio-stg) is deployed and torn down BY HAND with the Taskfile — it is not
# GitOps-managed. `task release-stg BRANCH=<b>` / `task stg-deploy TAG=<t>` / `task stg-teardown`.
# SealedSecrets are scoped to namespace kio-stg; kio-api points at the dedicated kio_stg DB.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kio-stg
images:
- name: harbor.squid-ink.us/politeauthority/kio-api
  newTag: stg-main
- name: harbor.squid-ink.us/politeauthority/kio-ui
  newTag: stg-main
resources:
- ../../base
- ./ingressroute.yaml
- ./secrets/sealed-api-secrets.yaml
- ./secrets/sealed-harbor-registry.yaml

patches:
- path: api-configmap-patch.yaml
  target:
    kind: ConfigMap
    name: kio-api-config
- path: mqtt-patch.yaml
  target:
    kind: Deployment
    name: kio-api
- path: cors-patch.yaml
  target:
    kind: Deployment
    name: kio-api
- path: ui-patch.yaml
  target:
    kind: Deployment
    name: kio-ui
- path: nodeport-patch.yaml
  target:
    kind: Service
    name: kio-api-nodeport
