apiVersion: v1
kind: ConfigMap
metadata:
  name: kio-api-config
data:
  LOG_LEVEL: "INFO"
  # --- Authentik login -----------------------------------------------------
  # Fill both in to offer "Sign in with Authentik" on the dashboard. The UI
  # reads them from the API (GET /auth/config); nothing to set on kio-ui.
  # Generate with: python3 scripts/authentik-setup.py --token <api-token>
  # AUTHENTIK_ISSUER: "https://auth.example.com/application/o/kio/"
  # AUTHENTIK_CLIENT_ID: "<client id from Authentik>"
  # AUTHENTIK_DISPLAY_NAME: "Authentik"
