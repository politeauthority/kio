[project]
name = "kio-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.2",
    "paho-mqtt>=2.2.0",
    "PyJWT>=2.8.0",
    "cryptography>=50.0.2",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.27.0",
    "black>=26.10.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | __pycache__
  | \.venv
  | alembic
)/
'''

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",   # line too long — Black handles this
    "E402",   # module-level import not at top
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
